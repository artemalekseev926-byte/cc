name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [claude/desktop-customization-app-sjq49b, main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: DeskForge-Windows
          path: |
            release/DeskForge-Setup-*.exe
            release/DeskForge-*-portable.exe
          retention-days: 30

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/DeskForge-Setup-*.exe
            release/DeskForge-*-portable.exe
          generate_release_notes: true
